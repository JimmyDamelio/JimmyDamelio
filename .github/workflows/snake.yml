# Regenerates the animated contribution snake every day and publishes it to the `output` branch.
name: snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8a9a5b&color_dots=#ebedf0,#c9d6a3,#a5b77a,#8a9a5b,#5f6e3a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#c9d6a3&color_dots=#161b22,#2b3a2f,#4d6140,#8a9a5b,#c9d6a3

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
