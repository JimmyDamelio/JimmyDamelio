<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Edunos Jimmy — SaaS, Security, Video in Code, AI Tools, Web Apps">
  <title>Edunos Jimmy</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1510"/>
      <stop offset="1" stop-color="#1a261f"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8a9a5b" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8a9a5b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; }
    .orb { animation: drift 20s ease-in-out infinite alternate; }
    .o2 { animation-duration: 26s; animation-delay: -9s; }
    @keyframes drift { from { transform: translate(0,0) } to { transform: translate(80px,-30px) } }
    .title { font-size: 72px; font-weight: 700; letter-spacing: -1.5px; fill: #f3efe4;
             opacity: 0; animation: rise 1s .2s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .line { stroke: #8a9a5b; stroke-width: 2; stroke-dasharray: 80; stroke-dashoffset: 80;
            animation: draw 1s .9s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    /* 5 words x 2.4s = 12s loop; each word is visible ~2s of its slot */
    .word { font-size: 22px; font-weight: 500; letter-spacing: 6px; fill: #a9b886; opacity: 0;
            animation: cycle 12s ease-in-out infinite; }
    .w2 { animation-delay: 2.4s } .w3 { animation-delay: 4.8s } .w4 { animation-delay: 7.2s } .w5 { animation-delay: 9.6s }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(8px) }
      3%   { opacity: 1; transform: none }
      17%  { opacity: 1; transform: none }
      20%  { opacity: 0; transform: translateY(-8px) }
      100% { opacity: 0 }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; } .title, .w1 { opacity: 1 } .line { stroke-dashoffset: 0 }
    }
  </style>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <circle class="orb" cx="220" cy="240" r="240" fill="url(#glow)"/>
  <circle class="orb o2" cx="980" cy="60" r="220" fill="url(#glow)"/>
  <text class="title" x="600" y="148" text-anchor="middle">Edunos Jimmy</text>
  <path class="line" d="M560 178 H640"/>
  <g text-anchor="middle">
    <text class="word w1" x="600" y="222">SAAS</text>
    <text class="word w2" x="600" y="222">SECURITY</text>
    <text class="word w3" x="600" y="222">VIDEO IN CODE</text>
    <text class="word w4" x="600" y="222">AI TOOLS</text>
    <text class="word w5" x="600" y="222">WEB APPS</text>
  </g>
</svg>
