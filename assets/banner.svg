<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Jimmy D'Amelio — builder">
  <title>Jimmy D'Amelio — builder</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1a14"/>
      <stop offset="1" stop-color="#1f2e25"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" x2="1">
      <stop offset="0" stop-color="#c9d6a3"/>
      <stop offset=".5" stop-color="#f3e9d2"/>
      <stop offset="1" stop-color="#c9d6a3"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8a9a5b" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8a9a5b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .orb { animation: drift 14s ease-in-out infinite alternate; }
    .o2 { animation-duration: 18s; animation-delay: -6s; }
    .o3 { animation-duration: 22s; animation-delay: -11s; }
    @keyframes drift { from { transform: translate(0,0) } to { transform: translate(120px,-40px) } }
    .dot { fill: #c9d6a3; animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
    .title { font: 700 64px 'Segoe UI', Helvetica, Arial, sans-serif; fill: url(#txt);
             opacity: 0; animation: rise 1.2s .2s ease-out forwards; }
    .sub { font: 400 24px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9d6a3; letter-spacing: 2px;
           opacity: 0; animation: rise 1.2s .9s ease-out forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(20px) } to { opacity: 1; transform: translateY(0) } }
    .line { stroke: #8a9a5b; stroke-width: 3; stroke-dasharray: 360; stroke-dashoffset: 360;
            animation: draw 1.4s 1.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; } .title, .sub { opacity: 1 } .line { stroke-dashoffset: 0 }
    }
  </style>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <circle class="orb" cx="180" cy="220" r="220" fill="url(#glow)"/>
  <circle class="orb o2" cx="900" cy="80" r="200" fill="url(#glow)"/>
  <circle class="orb o3" cx="1100" cy="260" r="160" fill="url(#glow)"/>
  <g>
    <circle class="dot" cx="90" cy="60" r="2"/>
    <circle class="dot" cx="320" cy="40" r="1.5" style="animation-delay:-1s"/>
    <circle class="dot" cx="1040" cy="150" r="2" style="animation-delay:-2s"/>
    <circle class="dot" cx="760" cy="260" r="1.5" style="animation-delay:-.5s"/>
    <circle class="dot" cx="1140" cy="50" r="2" style="animation-delay:-1.5s"/>
    <circle class="dot" cx="540" cy="275" r="1.5" style="animation-delay:-2.5s"/>
  </g>
  <text class="title" x="600" y="140" text-anchor="middle">Jimmy D'Amelio</text>
  <path class="line" d="M420 168 H780"/>
  <text class="sub" x="600" y="210" text-anchor="middle">BUILDER · VIDEO IN CODE · SAAS · SECURITY</text>
</svg>
